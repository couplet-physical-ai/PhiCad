<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- PhiCad mark: a phi built from PCB traces (vertical stem + ring), with pads at the trace ends. -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="#0f766e"/>
  <g fill="none" stroke="#ffffff" stroke-width="64" stroke-linecap="round">
    <ellipse cx="512" cy="512" rx="230" ry="190"/>
    <line x1="512" y1="230" x2="512" y2="794"/>
  </g>
  <g fill="#ffffff">
    <circle cx="512" cy="210" r="62"/>
    <circle cx="512" cy="814" r="62"/>
  </g>
  <g fill="#0f766e">
    <circle cx="512" cy="210" r="26"/>
    <circle cx="512" cy="814" r="26"/>
  </g>
</svg>
