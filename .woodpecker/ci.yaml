# Roadrunner CI (Woodpecker + Dagger, https://cicd.apps.example.com): the PhiCad fork-layer gate (`phicad check fast`, ai-view suites, schemas, ruff, Python 3.9 boundary, MCP registry contract, demos/ byte-clean, fork/upstream path boundary on PRs). No C++ build.
# `$$` escapes `$` for Woodpecker. Docs: https://cicd.docs.example.com/roadrunner/
labels:
  tier: "0"
when:
  - event: pull_request
  - event: [push, manual]
    branch: [master, dev]
# 2.4 GB of history and no LFS content: one commit is all any step reads.
clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      depth: 1
      lfs: false
steps:
  # The checkout (1.3 GB, all of it: ruff reads the root pyproject.toml, suites read demos/)
  # with a synthesized git index: check_style.py asks git which phicad/ files are tracked, and
  # the last command proves the suites left demos/ byte-identical.
  - name: fork-layer
    image: bash
    depends_on: []
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-runner v0.10.1 python-plain --src=. --repo="$${CI_REPO_NAME,,}" --python=3.13
        --pip=jsonschema --pip=ruff==0.16.6 --git-index --apt=gawk,libtk8.6
        --run='git status --porcelain >/dev/null && phicad/bin/phicad check fast
        && PYTHONPATH=phicad/plugins/ai-view python -m unittest discover -s phicad/plugins/ai-view -p "test_*.py" -v
        && python phicad/bin/check_schemas.py
        && ruff check --no-cache .
        && git status --porcelain demos/ && test -z "$$(git status --porcelain demos/)"'
        --dep-cache=registry.dev.example.com/cache
        --dep-cache-password=file:///etc/ci/cache-password --test-workers=2
  # fastmcp (phicad/mcp/requirements.txt) is the cached dependency layer; phicad-tool needs a
  # real venv at build/mcp-venv, which sees it through --system-site-packages. No kicad-cli:
  # PHICAD_BUILD points at a directory that does not exist, as in the original gate.
  - name: mcp-registry
    image: bash
    depends_on: []
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-runner v0.10.1 python-plain --src=. --repo="$${CI_REPO_NAME,,}" --python=3.13
        --requirements=phicad/mcp/requirements.txt --git-index
        --env=PHICAD_BUILD=/tmp/no-such-build-dir --env=PHICAD_MCP_TEST_ROOT=/tmp/mcp-scratch
        --env=PHICAD_MCP_OUT=/tmp/mcp-out
        --run='python -m venv --system-site-packages build/mcp-venv
        && build/mcp-venv/bin/python phicad/mcp/test_registry.py
        && git status --porcelain demos/ && test -z "$$(git status --porcelain demos/)"'
        --dep-cache=registry.dev.example.com/cache
        --dep-cache-password=file:///etc/ci/cache-password --test-workers=2
  # A real 3.9 interpreter byte-compiles the files `phicad` runs with bare python3 (macOS
  # /usr/bin/python3 is 3.9). Only phicad/ is uploaded.
  - name: python39-boundary
    image: bash
    depends_on: []
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-runner v0.10.1 python-plain --src=phicad --repo="$${CI_REPO_NAME,,}" --python=3.9
        --run='python -VV
        && python -m py_compile pylib/*.py mcp/doctor.py mcp/register.py mcp/sch_worker.py mcp/session_worker.py
        && echo "python 3.9 byte-compile clean"'
        --dep-cache=registry.dev.example.com/cache
        --dep-cache-password=file:///etc/ci/cache-password --test-workers=2
  # Fork-only work belongs under phicad/. Same comparison as before: GitHub's test merge of the
  # PR (refs/pull/N/merge, retried until it merges this head) against its first parent, the
  # base tip. Commits and trees only (--filter=blob:none, depth 2); the repo is public, so no
  # credential. Only phicad/ is uploaded and placed at <repo>/phicad for the script.
  - name: fork-boundary
    image: bash
    depends_on: []
    when:
      - event: pull_request
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-runner v0.10.1 python-plain --src=phicad --repo="$${CI_REPO_NAME,,}" --python=3.13
        --env="GH_REPO=$${CI_REPO}" --env="PR_NUMBER=$${CI_COMMIT_PULL_REQUEST}"
        --env="HEAD_SHA=$${CI_COMMIT_SHA}"
        --run='G=/tmp/boundary.git; mkdir -p /tmp/repo && cp -r /src /tmp/repo/phicad
        && git init -q --bare "$$G" && git --git-dir="$$G" remote add origin "https://github.com/$$GH_REPO.git"
        && n=0 && until timeout 120 git --git-dir="$$G" fetch -q --no-tags --filter=blob:none --depth=2 origin "+refs/pull/$$PR_NUMBER/merge:refs/ci/merge"
        && test "$$(git --git-dir="$$G" rev-parse refs/ci/merge^2)" = "$$HEAD_SHA"; do
        n=$$((n+1)); if [ "$$n" -ge 12 ]; then echo "refs/pull/$$PR_NUMBER/merge does not merge $$HEAD_SHA (conflict with the base branch?)"; exit 1; fi; sleep 10; done
        && GIT_DIR="$$G" python /tmp/repo/phicad/bin/check_fork_boundary.py --base "refs/ci/merge^1" --head refs/ci/merge --committed-only'
        --dep-cache=registry.dev.example.com/cache
        --dep-cache-password=file:///etc/ci/cache-password --test-workers=2
